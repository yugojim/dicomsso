services:
  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ -f /certificates/root-ca.pem ]; then
        echo 'Wazuh certificates already exist';
        exit 0;
      fi;
      rm -rf /wazuh-certificates;
      /entrypoint.sh"
    environment:
      CERT_TOOL_VERSION: "4.14"
    volumes:
      - ./wazuh/config/certs.yml:/config/certs.yml:ro
      - ./wazuh/config/certs:/certificates

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.5
    hostname: wazuh.indexer
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
      - ./wazuh/config/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/config/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh/config/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./wazuh/config/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/config/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
    # 不對外開 port：維修請用 docker compose exec wazuh-indexer curl ...
    expose:
      - "9200"
    networks:
      default:
        aliases:
          - wazuh.indexer

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.5
    hostname: wazuh.manager
    depends_on:
      - wazuh-indexer
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - wazuh_manager_api_configuration:/var/ossec/api/configuration
      - wazuh_manager_etc:/var/ossec/etc
      - wazuh_manager_logs:/var/ossec/logs
      - wazuh_manager_queue:/var/ossec/queue
      - wazuh_manager_var_multigroups:/var/ossec/var/multigroups
      - wazuh_manager_integrations:/var/ossec/integrations
      - wazuh_manager_active_response:/var/ossec/active-response/bin
      - wazuh_manager_agentless:/var/ossec/agentless
      - wazuh_manager_wodles:/var/ossec/wodles
      - wazuh_filebeat_etc:/etc/filebeat
      - wazuh_filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_manager/api.yaml:/var/ossec/api/configuration/api.yaml:ro
      - ./wazuh/config/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/config/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/config/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    ports:
      # agent 連線必要
      - "11514:1514"
      - "11515:1515"
      - "5514:514/udp"
    # Wazuh API 不對外開：維修請用 docker compose exec wazuh-manager ...
    expose:
      - "55000"
    networks:
      default:
        aliases:
          - wazuh.manager

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.5
    hostname: wazuh.dashboard
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - ./wazuh/config/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/config/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/config/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
    expose:
      - "5601"
    networks:
      default:
        aliases:
          - wazuh.dashboard

volumes:
  wazuh_indexer_data:
  wazuh_manager_api_configuration:
  wazuh_manager_etc:
  wazuh_manager_logs:
  wazuh_manager_queue:
  wazuh_manager_var_multigroups:
  wazuh_manager_integrations:
  wazuh_manager_active_response:
  wazuh_manager_agentless:
  wazuh_manager_wodles:
  wazuh_filebeat_etc:
  wazuh_filebeat_var:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:
