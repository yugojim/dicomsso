# ---------------------------------------------------------------------------
# TLS：自我簽署憑證（10 年），用 nginx/generate-cert.sh 產生。
# 所有對外的 HTTP 入口都走 https，唯一的例外是 :80，只做轉址。
# ---------------------------------------------------------------------------
ssl_certificate     /etc/nginx/certs/dicom-portal.crt;
ssl_certificate_key /etc/nginx/certs/dicom-portal.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1h;

# 有人用 http 直接連進來就導到 https 主入口
server {
    listen 80;
    server_name _;
    return 301 https://$host:8088$request_uri;
}

map $http_origin $dicom_cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1|192\.168\.1\.122|192\.168\.1\.112|192\.168\.1\.105):(3000|13000)$" $http_origin;
}

map $http_origin $fhir_cors_origin {
    default "";
    "~^https?://" $http_origin;
}

map $http_authorization $wazuh_proxy_authorization {
    default $http_authorization;
    "" $wazuh_authorization;
}

# 主入口：客戶上傳入口、電子病歷交換平台、/api、/fhir、DICOMweb
server {
    listen 8088 ssl;
    http2 on;
    server_name _;
    client_max_body_size 2g;

    root /usr/share/nginx/html;
    index index.html;

    # 主入口就是電子病歷交換平台；DICOM 上傳入口在 /upload/
    location = / {
        return 302 /his/;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    # 兩個前端各自是 hash routing 的單頁程式，找不到檔案時回自己的 index.html
    location /his/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /his/index.html;
    }

    location /upload/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /upload/index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/viewer {
        internal;
        proxy_pass http://backend:8000/api/auth/viewer;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FHIR Portal（/his/）用的同源 FHIR 入口，避免瀏覽器 CORS。
    # 權限檢查與 :18090 完全相同：讀要 fhir-user，寫要 fhir-admin。
    location = /_auth/fhir {
        internal;
        proxy_pass http://backend:8000/api/auth/fhir;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @fhir_unauthorized {
        default_type application/fhir+json;
        add_header WWW-Authenticate 'Bearer realm="dicom"' always;
        return 401 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"login","diagnostics":"Keycloak login required."}]}';
    }

    location @fhir_forbidden {
        default_type application/fhir+json;
        return 403 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"forbidden","diagnostics":"Keycloak role fhir-user (read) or fhir-admin (write) is required."}]}';
    }

    # 用 /fhir 而不是 /fhir/：transaction 是 POST 到 base（不帶結尾斜線），
    # 若只比對 /fhir/ 會落到 try_files 變成 301，POST 會失敗。
    location /fhir {
        auth_request /_auth/fhir;
        error_page 401 = @fhir_unauthorized;
        error_page 403 = @fhir_forbidden;

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    location /dicom-web/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $dicom_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        auth_request /api/auth/viewer;
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_set_header Host $http_host;
        add_header Access-Control-Allow-Origin $dicom_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
    }

    location /wado {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $dicom_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        auth_request /api/auth/viewer;
        proxy_pass http://orthanc:8042/wado;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_set_header Host $http_host;
        add_header Access-Control-Allow-Origin $dicom_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
    }

    # 正式環境建議不要暴露 Orthanc 管理 API 給客戶。
    # OHIF / DICOMweb 應另行搭配 Authorization Plugin 或後端授權閘道。
}

# Wazuh Dashboard（Keycloak 授權閘道）
server {
    listen 15601 ssl;
    server_name _;
    client_max_body_size 2g;

    location = /_auth/wazuh {
        internal;
        proxy_pass http://backend:8000/api/auth/wazuh;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_auth/wazuh;
        auth_request_set $wazuh_authorization $upstream_http_x_wazuh_authorization;
        error_page 401 403 =302 https://$host:8088/upload/;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wazuh_dashboard https://wazuh.dashboard:5601;
        proxy_pass $wazuh_dashboard;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Authorization $wazuh_proxy_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_flags wz-token nosecure;
        proxy_cookie_flags wz-user nosecure;
        proxy_redirect https://wazuh.dashboard:5601/ /;
    }
}

# HAPI FHIR 授權閘道：HAPI 本身不驗 token，一律先問 backend。
#   /fhir/...（REST API）：讀取需要 fhir-user，寫入（POST/PUT/PATCH/DELETE）需要 fhir-admin。
#   其他路徑（HAPI 內建測試頁）：一律需要 fhir-admin。
#   測試頁是 server-side 直接呼叫 HAPI 自己的 8080，繞得過上面的讀寫檢查，
#   所以只開放給本來就能寫入的 fhir-admin，避免變成 fhir-user 的提權管道。
# HAPI FHIR 對外 API（Keycloak 授權閘道）
server {
    listen 18090 ssl;
    server_name _;
    client_max_body_size 64m;

    location = /_auth/fhir-ui {
        internal;
        proxy_pass http://backend:8000/api/auth/fhir-ui;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/fhir {
        internal;
        proxy_pass http://backend:8000/api/auth/fhir;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @fhir_unauthorized {
        default_type application/fhir+json;
        add_header WWW-Authenticate 'Bearer realm="dicom"' always;
        add_header Access-Control-Allow-Origin $fhir_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 401 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"login","diagnostics":"Keycloak login required. Send Authorization: Bearer <access_token> or sign in at the portal first."}]}';
    }

    location @fhir_forbidden {
        default_type application/fhir+json;
        add_header Access-Control-Allow-Origin $fhir_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 403 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"forbidden","diagnostics":"Keycloak role fhir-user (read) or fhir-admin (write) is required."}]}';
    }

    # HAPI 內建測試頁與它的靜態檔：只給 fhir-admin，未授權就導回入口網站登入。
    location / {
        auth_request /_auth/fhir-ui;
        error_page 401 403 =302 https://$host:8088/upload/;

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }

    # FHIR REST API。
    location /fhir {
        # CORS preflight 不會帶 Authorization，必須在 auth_request 之前放行。
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $fhir_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, Prefer, If-Match, If-None-Exist" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        auth_request /_auth/fhir;
        error_page 401 = @fhir_unauthorized;
        error_page 403 = @fhir_forbidden;

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 不送 X-Forwarded-Port：交給 X-Forwarded-Host 內的 port 決定。
        # 不把使用者的 Keycloak token 往 HAPI 送，避免 token 落在 HAPI log。
        proxy_set_header Authorization "";
        add_header Access-Control-Allow-Origin $fhir_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Location, Content-Location, ETag, Last-Modified" always;
    }
}

# Orthanc 管理入口（Keycloak 授權閘道）
server {
    listen 18042 ssl;
    server_name _;
    client_max_body_size 2g;

    location = /_auth/orthanc-admin {
        internal;
        proxy_pass http://backend:8000/api/auth/orthanc-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_auth/orthanc-admin;
        error_page 401 403 =302 https://$host:8088/upload/;

        proxy_pass http://orthanc:8042;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://orthanc:8042/ /;
    }
}

# ---------------------------------------------------------------------------
# Keycloak：容器本身只跑 http，TLS 在這裡終結。
# Keycloak 需要 X-Forwarded-* 才能產生正確的 issuer 與轉址網址
# （對應 compose 的 KC_PROXY_HEADERS=xforwarded）。
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}

# ---------------------------------------------------------------------------
# OHIF Viewer：容器不再對外開 port，一律經過這裡（同一張憑證）。
# ---------------------------------------------------------------------------
server {
    listen 13000 ssl;
    server_name _;
    client_max_body_size 64m;

    location / {
        proxy_pass http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
