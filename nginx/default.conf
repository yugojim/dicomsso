map $http_origin $dicom_cors_origin {
    default "";
    "~^http://(localhost|127\.0\.0\.1|192\.168\.1\.112|192\.168\.1\.105):3000$" $http_origin;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2g;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/viewer {
        internal;
        proxy_pass http://backend:8000/api/auth/viewer;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dicom-web/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $dicom_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        auth_request /api/auth/viewer;
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_set_header Host $http_host;
        add_header Access-Control-Allow-Origin $dicom_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
    }

    location /wado {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $dicom_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        auth_request /api/auth/viewer;
        proxy_pass http://orthanc:8042/wado;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
        proxy_set_header Host $http_host;
        add_header Access-Control-Allow-Origin $dicom_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
    }

    # 正式環境建議不要暴露 Orthanc 管理 API 給客戶。
    # OHIF / DICOMweb 應另行搭配 Authorization Plugin 或後端授權閘道。
}

server {
    listen 5601;
    server_name _;
    client_max_body_size 2g;

    location = /_auth/wazuh {
        internal;
        proxy_pass http://backend:8000/api/auth/wazuh;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_auth/wazuh;
        auth_request_set $wazuh_authorization $upstream_http_x_wazuh_authorization;
        error_page 401 403 =302 http://$host:8088/;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wazuh_dashboard https://wazuh.dashboard:5601;
        proxy_pass $wazuh_dashboard;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Authorization $wazuh_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect https://wazuh.dashboard:5601/ /;
    }
}

server {
    listen 8042;
    server_name _;
    client_max_body_size 2g;

    location = /_auth/orthanc-admin {
