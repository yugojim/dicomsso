    }

    location / {
        auth_request /_auth/orthanc-admin;
        error_page 401 403 =302 http://$host:8088/;

        proxy_pass http://orthanc:8042;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5j";
