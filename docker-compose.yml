services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dicom_portal
      POSTGRES_USER: dicom
      POSTGRES_PASSWORD: dicom
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # 不對外開 port，維修請用：docker compose exec postgres psql -U dicom -d dicom_portal
    expose:
      - "5432"

  orthanc:
    image: jodogne/orthanc-plugins
    # Apple Silicon 若遇到 platform warning，可打開下一行：
    # platform: linux/amd64
    command: ["/etc/orthanc/orthanc.json"]
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    ports:
      - "14242:4242"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # TLS 在 nginx :8443 終結，Keycloak 靠 X-Forwarded-* 產生正確的 issuer 與轉址
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-dicom.json:/opt/keycloak/data/import/realm-dicom.json:ro
      - ./keycloak/themes/dicom:/opt/keycloak/themes/dicom:ro
    # 不對外開 port：一律走 https://<host>:8443（nginx 反向代理）
    expose:
      - "8080"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dicom:dicom@postgres:5432/dicom_portal
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: orthanc
      ORTHANC_PASSWORD: orthanc
      KEYCLOAK_ISSUER: https://192.168.1.122:8443/realms/dicom
      KEYCLOAK_ALLOWED_ISSUERS: https://192.168.1.122:8443/realms/dicom,https://192.168.1.112:8443/realms/dicom,https://192.168.1.105:8443/realms/dicom,https://localhost:8443/realms/dicom,https://127.0.0.1:8443/realms/dicom
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/dicom/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: dicom-portal
      KEYCLOAK_AUDIENCE: dicom-portal-api
      TENANT_CLAIM: tenant_id
      CORS_ORIGIN: https://192.168.1.122:8088
      OHIF_VIEWER_URL: ${OHIF_VIEWER_URL:-https://192.168.1.122:13000/viewer}
      DICOMWEB_PUBLIC_URL: ${DICOMWEB_PUBLIC_URL:-https://192.168.1.122:8088/dicom-web}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_GROUP_ID: ${LINE_GROUP_ID:-}
      LINE_COUPON_ID: ${LINE_COUPON_ID:-}
    depends_on:
      - postgres
      - orthanc
      - keycloak
    # 不對外開 port：一律經由 nginx 的 /api/（維修可用 docker compose exec）
    expose:
      - "8000"

  hapi-fhir:
    image: hapiproject/hapi:latest
    environment:
      # 用 additional-location：保留 image 內建的 application.yaml 預設值，只覆蓋這裡列出的項目。
      # 若改用 SPRING_CONFIG_LOCATION 會整份取代掉內建設定（例如 spring.flyway.enabled=false），HAPI 會啟動失敗。
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:///app/config/application.yaml
    volumes:
      - ./fhir/application.yaml:/app/config/application.yaml:ro
    depends_on:
      - postgres
    # 不對外開 port：一律經由 frontend nginx:18090 的 Keycloak 授權閘道存取。
    expose:
      - "8080"

  ohif:
    image: ohif/viewer:latest
    volumes:
      - ./ohif/index.html:/usr/share/nginx/html/index.html:ro
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc
    # 不對外開 port：一律走 https://<host>:13000（nginx 反向代理）
    expose:
      - "80"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - orthanc
      - hapi-fhir
      - keycloak
      - ohif
    ports:
      - "80:80"        # 只做 http → https 轉址
      - "8088:8088"    # 主入口（https）
      - "8443:8443"    # Keycloak（https）
      - "13000:13000"  # OHIF Viewer（https）
      - "18042:18042"  # Orthanc 管理入口（https）
      - "15601:15601"  # Wazuh Dashboard（https）
      - "18090:18090"  # HAPI FHIR 對外 API（https）

volumes:
  postgres_data:
  orthanc_data:
